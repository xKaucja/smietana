<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Śmietana</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #ffffff;
      color: #111111;
    }
  </style>
</head>
<body class="bg-white min-h-screen flex items-center justify-center p-6 selection:bg-neutral-200">

  <main class="flex flex-col items-center justify-center text-center">
    <!-- Napis Śmietana -->
    <h1 class="text-5xl sm:text-6xl md:text-7xl font-bold tracking-tight text-neutral-900 mb-6 sm:mb-8 select-none">
      Śmietana
    </h1>

    <!-- Wyśrodkowane zdjęcie s.png -->
    <div class="flex items-center justify-center max-w-sm sm:max-w-md w-full">
      <img 
        src="s.png" 
        alt="Śmietana Piątnica" 
        class="max-w-full h-auto object-contain select-none transition-transform duration-300 hover:scale-105"
      />
    </div>
  </main>

</body>
</html>
